<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Manager — Kamkhadze PA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="case-manager.css" />
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <!-- Auth loads first; it shows the login screen and resolves Auth.ready -->
  <script src="case-manager-auth.js"></script>
  <!-- App waits for Auth.ready before booting -->
  <script src="case-manager.js"></script>
  <!-- v2 patch: Zoom, Dropbox vault, Excel import, Email hooks, timezone search -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="case-manager-v2.js"></script>
  <!-- Cloud sync layer -->
  <script src="case-manager-supabase.js"></script>
  <!-- Role-based access control -->
  <script src="case-manager-rbac.js"></script>
  <!-- Automatic time tracking engine -->
  <script src="case-manager-time.js"></script>
  <!-- Reporting suite (8 reports) -->
  <script src="case-manager-reports.js"></script>
  <!-- USCIS Officer Report -->
  <script src="case-manager-officers.js"></script>
  <!-- Unit tests (accessible via CaseManagerTests.run() in DevTools) -->
  <script src="case-manager-tests.js"></script>
</body>
</html>
